name: Busca diária de PCs
on:
  schedule:
    - cron: "0 10 * * *"   # 07:00 de Brasília
  workflow_dispatch:
    inputs:
      paginas:
        description: "Páginas por busca"
        default: "3"
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Rodar pipeline
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: PYTHONPATH=src python -m revenda.main --paginas ${{ github.event.inputs.paginas || 3 }}
      - uses: actions/upload-artifact@v4
        with: { name: planilha-excel, path: saida/*.xlsx, retention-days: 30 }
